description: >-
  **Spudy** is a lightweight, self-hosted bridge between **Telegram** and **Discord** that forwards messages, media files, and social videos directly to your Discord channels via webhooks.

  ### What It Does

  * **Media & Text Routing**: Automatically forwards text, photos, videos, GIFs, and video notes from Telegram to Discord with the sender's name and avatar.
  * **TikTok & Instagram Support**: Integrates with **Cobalt API** to download and send TikTok and Instagram videos, audio, and photo carousels directly into Discord.
  * **Multi-Webhook Selection**: Sends immediately if a user has one assigned webhook, or displays interactive Telegram buttons to choose a target channel when multiple webhooks are available.
  * **Per-User Access Control**: Manage allowed webhooks per Telegram User ID or set a global rule for everyone via the built-in Web UI.
  * **Zero-Restart Configuration**: Update bot tokens, webhooks, and routing filters on the fly from the dashboard without restarting the container.

releaseNotes: >-
  - Migrated to built-in Node.js 22 SQLite (zero native C++ dependencies, faster startup, lower RAM usage).
  - Modularized backend and Web UI with live request filtering, webhook testing, and Cobalt API connection diagnostics.
  - Added instant bot hot-reload after saving a Telegram token in Setup or Settings.
